<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Offline — Speechy AAC</title>
    <meta name="theme-color" content="#4A90D9" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: 'Nunito', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(135deg, #4A90D9 0%, #6FB1E8 100%);
        color: #fff;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
      }
      .card {
        background: rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
        border-radius: 24px;
        padding: 32px 24px;
        max-width: 420px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      }
      h1 { margin: 0 0 12px; font-size: 28px; font-weight: 800; }
      p { margin: 0 0 20px; opacity: 0.95; line-height: 1.5; }
      button {
        background: #fff; color: #2563a8; border: 0;
        font-weight: 800; font-size: 16px;
        padding: 12px 24px; border-radius: 12px; cursor: pointer;
      }
      .emoji { font-size: 56px; margin-bottom: 12px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="emoji">📡</div>
      <h1>You're offline</h1>
      <p>Speechy AAC needs a connection to load this page. Your saved boards and core words still work once the app is open.</p>
      <button onclick="location.reload()">Try Again</button>
    </div>
  </body>
</html>
